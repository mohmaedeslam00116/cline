# CodeRabbit Configuration — Cline fork (LENS Workstation base)
# This fork hosts the Cline desktop app base for LENS Workstation.
# Schema: https://coderabbit.ai/integrations/code-rabbit-overrides.v2.json

language: "en-US"
early_access: true
tone_instructions: >
  Full-stack review: backend correctness (logic, async error paths, resource
  cleanup), UI defects (state, rendering, a11y, RTL), security boundaries,
  type safety. Precise, actionable findings.

reviews:
  profile: "chill"
  request_changes_workflow: true
  high_level_summary: true
  poem: false
  collapse_walkthrough: false
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - "main"

  path_filters:
    - "!**/dist/**"
    - "!**/node_modules/**"
    - "!**/*.lock"
    - "!bun.lock"
    - "!package-lock.json"
    - "!.agents/**"
    - "!agent/**"
    - "!.claude/**"
    - "!skills-lock.json"
    - "!apps/vscode/src/generated/**"
    - "!apps/vscode/bin/**"
    - "!**/proto/**"

  path_instructions:
    - path: "**/*.{ts,tsx,js,mjs}"
      instructions: >
        Enforce strict TypeScript hygiene, robust error handling, and zero unhandled
        promise rejections. Never allow arbitrary eval, unsanitized innerHTML, or dynamic
        command string concatenation.

    - path: "lens/**"
      instructions: >
        LENS Workstation engine additions (hexagonal, dependency-free packages):
        1. Strict Hexagonal Architecture: the agent core MUST depend only on typed ports
           (RepoInspectionPort, ResearchRetrievalPort, TelemetryPort, CancellationPort).
           NEVER import Tauri/Electron/VS Code host APIs or Node host modules inside the core.
        2. Privileged Policy Layer: external research data, documentation excerpts, and web
           pages must ALWAYS be treated as untrusted data (contentIsUntrusted: true). Untrusted
           content must NEVER dynamically expand tool execution capabilities or bypass user gates.
        3. Phase 1 Containment: in read-only mode, block all mutating filesystem writes,
           terminal execution, or external network requests outside the retrieval boundary.

    - path: "lens/**/terminal/**"
      instructions: >
        Terminal Execution & Process Sandboxing:
        1. Environment Sanitization: verify that child processes use a strict allowlist
           (PATH, SYSTEMROOT, TEMP, TMP, LANG, SHELL). Reject any inheritance of sensitive
           environment variables (API keys, SSH sockets, AWS/GCP tokens, app secrets).
        2. Process-Tree Termination: ensure bulletproof process termination on cancellation or
           timeout. On Windows, verify taskkill /pid <PID> /T /F. On macOS/Linux, verify detached
           process groups with process.kill(-pid, 'SIGKILL'). Reject bare child.kill() without
           tree cleanup.
        3. Structured Execution: agent-driven commands must execute via child_process.spawn with
           structured argument arrays (args: string[]) and shell: false. Reject raw shell string
           execution.

    - path: "lens/**/filesystem/**"
      instructions: >
        Atomic File Modifications & Reversibility:
        1. Pre-Write Validation: every file write must verify the base file SHA-256 hash before
           applying. Detect and prevent symlink directory traversal attacks (Path Traversal /
           Zip-Slip).
        2. Atomic Transactions: multi-file changes must succeed or fail as an all-or-nothing
           transaction.
        3. Rollback Manifests: every mutation must record a reversible manifest (base SHA-256,
           new SHA-256, diff patch, timestamp) enabling instant 1-click rollback.

    - path: "apps/examples/desktop-app/**"
      instructions: >
        Desktop app (Tauri v2 shell + Next.js webview + Bun sidecar) — the LENS host surface:
        1. Renderer containment: enforce contextIsolation, no nodeIntegration, and strictly
           typed transport channels. Loopback endpoints (sidecar 127.0.0.1) must require a
           per-launch session token on all non-static requests.
        2. Sidecar is the privileged boundary: file mutations, terminal commands, and network
           egress must be mediated by the policy layer and capability grants — never performed
           directly from the webview.
        3. Keep changes additive where possible so upstream merges of the Cline desktop app
           remain routine.

    - path: "apps/examples/desktop-app/webview/**"
      instructions: >
        Desktop Workstation UI (Next.js webview) — hunt UI defects:
        1. Runtime correctness: unhandled promise rejections, missing loading/empty/error
           states, broken state transitions, race conditions in effects and subscriptions,
           memory leaks from uncleared listeners/timers.
        2. Visual Provenance: ensure all external research claims are visibly badged as
           '[External Evidence - Untrusted]'; verify click-through from diffs to evidence.
        3. Adhere to monochrome neutral palette (#111111 / #161616 / #1E1E1E) and clean typography.
        4. Bilingual parity (Arabic & English): seamless LTR/RTL layout, no hardcoded
           direction or untranslated strings (Inter & Cairo fonts).
        5. Accessibility: keyboard navigation, focus management, contrast, ARIA correctness.

    - path: "apps/examples/desktop-app/sidecar/**"
      instructions: >
        Sidecar backend (Bun) — hunt backend defects:
        1. Correctness: unhandled promise rejections, swallowed errors, missing error
           propagation to the transport, incorrect async sequencing, off-by-one/boundary bugs.
        2. Resource safety: unclosed sockets/streams/files, missing cleanup on disconnect,
           process/thread leaks, unbounded buffers or caches.
        3. Boundary validation: validate every transport message and IPC input (types, size,
           shape) before use — the sidecar is the privileged boundary; reject malformed input
           explicitly.
        4. Session handling: approval-token checks, session-state transitions, and reconnect
           recovery must be race-free.

    - path: "docs/adr/**"
      instructions: >
        Architecture Decision Records: check that new ADRs follow sequential numbering,
        state their decision and rationale, and do not contradict accepted ADRs without
        an explicit supersession note.

    - path: "**/*.test.ts"
      instructions: >
        Test Suite & Quality:
        1. Require deterministic unit and integration tests for every new feature or bugfix.
        2. Avoid flaky network dependencies or race conditions in test fixtures.

chat:
  auto_reply: true
